
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Book Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Online Book Management System</h1>

        <h2>Add / Update Book</h2>

        <form id="bookForm">

            <input type="hidden" id="bookId">

            <input
                type="text"
                id="title"
                placeholder="Enter Book Title"
                required
            >

            <input
                type="text"
                id="author"
                placeholder="Enter Author Name"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Enter Price"
                min="0"
                step="any"
                required
            >

            <button type="submit">Save Book</button>

            <button type="button" onclick="resetForm()">
                Clear
            </button>

        </form>

        <h2>Book List</h2>

        <p id="message"></p>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookList">
            </tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
